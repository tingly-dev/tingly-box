version: '3'

vars:
  WAILS_PACKAGE_PATH: ./gui/wails3

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    dir: gui/wails3
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: '{{if eq .FRONTEND_PREBUILT "true"}}true{{else}}pnpm --version{{end}}'
        msg: "pnpm not found. Install it via: npm install -g pnpm"
    cmds:
      # FRONTEND_PREBUILT: see build:frontend:dist.
      - '{{if eq .FRONTEND_PREBUILT "true"}}true{{else}}pnpm install{{end}}'

  build:frontend:
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend and place it where the binary embeds it
    # The same build as the CLI's web UI (`pnpm build`), embedded from the
    # same place (internal/web/dist, see internal/assets.go): the page picks
    # its host bridge at runtime (frontend/src/host), so the desktop window
    # needs no build of its own and no generated wails bindings.
    #
    # The copy is deliberately outside the cached build:frontend:dist below.
    # When it lived inside, an up-to-date frontend/dist skipped the copy too,
    # and a binary built after `task cleanup` (or a CLI build) silently
    # embedded the placeholder instead of the UI.
    run: once
    deps:
      - task: build:frontend:dist
        vars:
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      # Clear the previous build's hashed chunks first, or every rebuild
      # leaves its old ones in the embedded FS.
      - rm -rf ./internal/web/dist/assets
      - mkdir -p ./internal/web/dist
      - cp -R frontend/dist/* ./internal/web/dist/

  build:frontend:dist:
    label: build:frontend:dist (PRODUCTION={{.PRODUCTION}})
    summary: Build frontend/dist (skipped when the sources are unchanged)
    internal: true
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task; run:once keeps them from building the
    # frontend twice into the same dist concurrently (#4637).
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
    cmds:
      # FRONTEND_PREBUILT=true (env or var): frontend/dist already holds the
      # build, e.g. the release's shared `frontend-dist` artifact
      # (.github/workflows/build-frontend.yml), so neither Node nor pnpm is
      # needed and only the copy in build:frontend runs.
      - '{{if eq .FRONTEND_PREBUILT "true"}}test -f dist/index.html || { echo "FRONTEND_PREBUILT=true but frontend/dist/index.html is missing"; exit 1; }{{else}}pnpm run {{.BUILD_COMMAND}}{{end}}'
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
    vars:
      # Our frontend build scripts (see frontend/package.json).
      BUILD_COMMAND: '{{if eq .PRODUCTION "true"}}build{{else}}build:dev{{end}}'


  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    run: once
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:pnpm

  frontend:dev:pnpm:
    dir: frontend
    cmds:
      # Invoke vite directly instead of `pnpm run dev -- ...`: the dev script
      # already hardcodes --port, and duplicated flags confuse vite's CLI.
      # Bind to 127.0.0.1 explicitly — the wails3 asset proxy dials the dev
      # server with tcp4 only, so a vite bound to ::1 (what `localhost` can
      # resolve to) yields 502 Bad Gateway on every request in the GUI window.
      - pnpm exec vite --mode development --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.BIN_NAME}}" -binaryname "{{.BIN_NAME}}" -config config.yml -dir .

services:
  # Tingly Box Server
  tingly-box:
    build:
      # Repo root: the Dockerfile COPYs build/docker/docker-entrypoint-npm.sh,
      # so the context can't be this directory (build/docker) itself.
      context: ../..
      dockerfile: build/docker/docker.npm.Dockerfile
    container_name: tingly-box
    ports:
      - "12581:12580"
    volumes:
      # Mount configuration directory (config, memory, logs and db all live
      # under this single tree, see internal/config/app_config.go)
      - ./data/.tingly-box:/app/.tingly-box
    environment:
      - TINGLY_PORT=12580
      - TINGLY_HOST=0.0.0.0
      - TINGLY_DEBUG=false
    restart: unless-stopped
    # HTTP probe, not a second `tingly-box` process: a CLI process opens the
    # server's SQLite database too, and two writers on a Docker Desktop bind
    # mount corrupted usage data (#1912). Mirrors the image's HEALTHCHECK.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.TINGLY_PORT||12580)+'/api/v1/info/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development mode - mount source and rebuild manually
  tingly-box-dev:
    build:
      context: ../..
      dockerfile: build/docker/docker.npm.Dockerfile
    container_name: tingly-box-dev
    ports:
      - "12581:12580"
    volumes:
      # Mount configuration directory (config, memory, logs and db all live
      # under this single tree, see internal/config/app_config.go)
      - ./data/.tingly-box:/app/.tingly-box
    environment:
      - TINGLY_PORT=12580
      - TINGLY_HOST=0.0.0.0
      - TINGLY_DEBUG=true
    profiles:
      - dev

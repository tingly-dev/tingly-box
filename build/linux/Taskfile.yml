version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-Linux or no CC available)
  CROSS_IMAGE: wails-cross
  # Package version: VERSION (Taskfile.wails.yml: release tag or git describe)
  # without its leading "v". deb/rpm versions must start with a digit, so a
  # non-numeric one (dev-<sha>, a bare commit) becomes 0.0.0~<version>, which
  # also sorts below every real release.
  PKG_VERSION:
    sh: |
      v="{{.VERSION}}"; v="${v#v}"
      case "$v" in [0-9]*) echo "$v" | tr '-' '~' ;; *) echo "0.0.0~$(echo "$v" | tr -c 'A-Za-z0-9.+~\n' '.')" ;; esac

tasks:
  build:
    summary: Builds the application for Linux
    cmds:
      # Linux requires CGO - use Docker when:
      # 1. Cross-compiling from non-Linux, OR
      # 2. No C compiler is available, OR
      # 3. Target architecture differs from host architecture (cross-arch compilation)
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          PRODUCTION: '{{.PRODUCTION}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.BIN_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      HAS_CC:
        sh: 'wails3 tool has "gcc|clang"'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - |
        export cwd=`pwd`
        cd {{.WAILS_PACKAGE_PATH}}
        go build {{.BUILD_FLAGS}} -o "${cwd}/{{.OUTPUT}}" ./
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s {{.VERSION_LDFLAGS}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.BIN_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Builds for Linux using Docker (for non-Linux hosts or when no C compiler available)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation to Linux. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.BIN_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} "{{.CROSS_IMAGE}}" linux {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.BIN_NAME}}-linux-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.BIN_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the GUI for Linux amd64 as .deb and .rpm (bin/tingly-box-gui-linux-amd64.{deb,rpm})
    # amd64 only: the release ships no other Linux GUI build. AppImage is
    # deliberately not produced — bundling WebKitGTK (with its helper
    # processes) into one is fragile, while a deb/rpm lets the distribution
    # supply GTK4/WebKitGTK 6.0 (see build/linux/nfpm/nfpm.yaml).
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: amd64
    cmds:
      - task: generate:deb
      - task: generate:rpm

  generate:deb:
    summary: Creates the deb package
    cmds:
      # Into a fresh dir first: nfpm names the file after name/version/arch,
      # and the release wants one stable name per format.
      - rm -rf {{.ROOT_DIR}}/bin/pkg-deb && mkdir -p {{.ROOT_DIR}}/bin/pkg-deb
      - wails3 tool package -name tingly-box-gui -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin/pkg-deb
      - mv {{.ROOT_DIR}}/bin/pkg-deb/*.deb {{.ROOT_DIR}}/bin/tingly-box-gui-linux-amd64.deb
      - rmdir {{.ROOT_DIR}}/bin/pkg-deb
    env:
      PKG_VERSION: '{{.PKG_VERSION}}'

  generate:rpm:
    summary: Creates the rpm package
    cmds:
      # Into a fresh dir first: nfpm names the file after name/version/arch,
      # and the release wants one stable name per format.
      - rm -rf {{.ROOT_DIR}}/bin/pkg-rpm && mkdir -p {{.ROOT_DIR}}/bin/pkg-rpm
      - wails3 tool package -name tingly-box-gui -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin/pkg-rpm
      - mv {{.ROOT_DIR}}/bin/pkg-rpm/*.rpm {{.ROOT_DIR}}/bin/tingly-box-gui-linux-amd64.rpm
      - rmdir {{.ROOT_DIR}}/bin/pkg-rpm
    env:
      PKG_VERSION: '{{.PKG_VERSION}}'

  run:
    vars:
      RUN_ARGS: '{{.RUN_ARGS | default ""}}'
    cmds:
      - '{{.BIN_DIR}}/{{.BIN_NAME}} {{.RUN_ARGS}}'

# Linux package for the desktop GUI (deb / rpm), built by
# `task linux:package:gui` and the GUI workflow (.github/workflows/release-gui.yml).
# See https://nfpm.goreleaser.com for the format.
#
# The package is tingly-box-gui and installs the binary as
# /usr/bin/tingly-box-gui, never as `tingly-box`: that name belongs to the CLI
# (npm install -g, release binary), where a bare run prints help. A GUI binary
# shadowing it on PATH would open a window instead.
#
# PKG_VERSION is supplied by the Taskfile: the release tag without its leading
# "v" (deb/rpm versions must start with a digit).

name: "tingly-box-gui"
arch: "amd64"
platform: "linux"
version: "${PKG_VERSION}"
version_schema: none
section: "devel"
priority: "optional"
maintainer: "Tingly Dev <box@tingly.dev>"
description: |
  Tingly Box desktop app.
  An intelligence orchestrator: LLM gateway, remote control and guard rails,
  with a tray icon and a native window.
vendor: "Tingly.Dev"
homepage: "https://github.com/tingly-dev/tingly-box"
license: "MPL-2.0"

contents:
  - src: "./bin/tingly-box-gui"
    dst: "/usr/bin/tingly-box-gui"
    file_info:
      mode: 0755
  # Pre-sized from build/appicon.png: hicolor has no 1024px directory.
  - src: "./build/linux/icons/dev.tingly.box-256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/dev.tingly.box.png"
  - src: "./build/linux/icons/dev.tingly.box-512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/dev.tingly.box.png"
  - src: "./build/linux/dev.tingly.box.desktop"
    dst: "/usr/share/applications/dev.tingly.box.desktop"

# GTK4 + WebKitGTK 6.0, the stack wails v3 links by default:
# Ubuntu 24.04+, Debian 13+, Fedora 40+.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/refresh-desktop-caches.sh"
  postremove: "./build/linux/nfpm/scripts/refresh-desktop-caches.sh"

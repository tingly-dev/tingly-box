[project]
name = "tingly"
version = "0.1.0"
description = "Framework for writing a tingly-box provider in Python, and calling tingly-box back."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tingly*"]

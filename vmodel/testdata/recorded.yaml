id: recorded-hello
kind: recording
description: A recorded Chat response reused by the existing protocol matrix.
responses:
  openai_chat:
    status: 200
    body:
      id: chatcmpl-recorded
      object: chat.completion
      created: 1700000000
      model: recorded-hello
      choices:
        - index: 0
          message: {role: assistant, content: Hello from a recording.}
          finish_reason: stop
      usage: {prompt_tokens: 10, completion_tokens: 8, total_tokens: 18}
    stream:
      - 'data: {"id":"chatcmpl-recorded","object":"chat.completion.chunk","created":1700000000,"model":"recorded-hello","choices":[{"index":0,"delta":{"role":"assistant","content":"Hello from a recording."},"finish_reason":null}]}'
      - 'data: {"id":"chatcmpl-recorded","object":"chat.completion.chunk","created":1700000000,"model":"recorded-hello","choices":[{"index":0,"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":8,"total_tokens":18}}'
      - 'data: [DONE]'
expect:
  http_status: 200
  content_equals: Hello from a recording.
# Completion reasons differ by client protocol (stop/end_turn/completed).
# Keep the shared expectations on status and content.
structural:
  http_status: 200
  content_non_empty: true

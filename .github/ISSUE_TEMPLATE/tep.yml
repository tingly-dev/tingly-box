name: "TEP: Tingly-Box Enhancement Proposal"
description: Propose a significant enhancement, design change, or new capability for Tingly-Box
title: "[TEP] "
labels: ["tep", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A **TEP (Tingly-Box Enhancement Proposal)** is for proposals that require design discussion before implementation — new capabilities, architectural changes, or cross-cutting improvements.

        For simple feature requests, use the [Feature](?template=feature.yml) template instead.

        Just write the subject after `[TEP]`: the issue number is added for you, so `[TEP] Multi-Provider Load Balancing Strategy` becomes `[TEP-1231] Multi-Provider Load Balancing Strategy`.

  - type: input
    id: version
    attributes:
      label: Target Version
      description: Which version is this proposal targeting?
      placeholder: "e.g. v0.2.0 or TBD"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tingly-Box is this about? It becomes an area/<name> label.
      options:
        - Gateway / Protocol Conversion
        - Load Balancing & Failover
        - Smart Routing & Rules
        - Guard Rails
        - Auth / OAuth
        - Usage / Quota / Observability
        - Agent Management
        - Remote Control / Bot
        - Projects
        - UI / Frontend
        - Performance
        - Build / Install / Deployment
        - Not sure
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation & Problem Statement
      description: What problem does this solve? Why is it needed? Include current pain points or limitations.
      placeholder: |
        Currently, when X happens, the system does Y which causes Z.
        Users are affected because...
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Proposed Design
      description: Describe the proposed solution. Include architecture, data flow, API changes, or component interactions as needed.
      placeholder: |
        ## Overview
        ...

        ## Components Affected
        - `internal/xxx/` — ...
        - `frontend/xxx/` — ...

        ## Data Flow
        ...

        ## API Changes
        ...
    validations:
      required: false

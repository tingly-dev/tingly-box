name: Bug Report
description: Report a bug in Tingly-Box
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of Tingly-Box are you using?
      placeholder: "e.g. v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS & Architecture
      description: Which operating system and CPU architecture are you running Tingly-Box on?
      options:
        - macOS Apple Silicon (M-chip)
        - macOS Intel
        - Windows x86_64
        - Windows ARM64
        - Linux x86_64
        - Linux ARM64
        - Other
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which area does this bug affect?
      options:
        - Gateway / Protocol Conversion
        - Load Balancing & Failover
        - Smart Routing & Rules
        - Guard Rails
        - Auth / OAuth
        - Usage / Quota / Observability
        - Agent Management
        - Remote Control / Bot
        - UI / Frontend
        - Performance
        - Build / Install / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: The request context when the bug occurred. Fill in the keys that apply and delete the rest.
      value: |
        - Agent / Client: e.g. Claude Code, Codex CLI, opencode, Gemini CLI, other apps
        - Source Protocol: e.g. anthropic / openai / openai_responses / google (if protocol conversion is involved)
        - Provider: e.g. Anthropic, OpenAI, Google AI Studio, OpenRouter, custom endpoint
        - Model: e.g. claude-sonnet-4-5, gpt-5, gemini-2.5-pro
        - Request Specifics: e.g. streaming / non-streaming, tool calls, image input, prompt cache, MCP
        - Error / Symptom: e.g. upstream returns 400 as soon as a message contains an image

        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs or error messages
      render: shell
    validations:
      required: false

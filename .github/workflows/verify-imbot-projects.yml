name: Verify IM Bot and Projects

on:
  pull_request:
    paths:
      - 'agentboot/**'
      - 'imbot/**'
      - 'remote/**'
      - 'sandbox/**'
      - 'projects/**'
      - 'internal/config/**'
      - 'internal/db/**'
      - 'internal/server/**'
      - 'internal/tbclient/**'
      - 'libs/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work*'
      - 'build/darwin/**'
      - 'Taskfile.wails.yml'
      - '.github/scripts/verify-macos-gui.sh'
      - '.github/workflows/verify-imbot-projects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-imbot-projects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-build:
    name: Build CLI and GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Prepare frontend placeholders for linking
        shell: bash
        run: |
          mkdir -p frontend/dist internal/web/dist projects/web/dist
          echo '<html></html>' > frontend/dist/index.html
          echo '<html></html>' > internal/web/dist/index.html
          echo '<html></html>' > projects/web/dist/index.html
      - name: Build CLI
        shell: bash
        run: go build -o "$RUNNER_TEMP/tb-cli" ./cli/tingly-box
      - name: Build GUI with native dependencies
        if: runner.os == 'Windows'
        shell: bash
        working-directory: gui/wails3
        run: go build -tags production,private_mac_apis -o "$RUNNER_TEMP/tb-gui" .
      - name: Install macOS release build tools
        if: runner.os == 'macOS'
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Verify macOS release build and package
        if: runner.os == 'macOS'
        run: bash .github/scripts/verify-macos-gui.sh
      - name: Verify distinct macOS application delegates
        if: runner.os == 'macOS'
        shell: bash
        run: |
          nm -Uj bin/TinglyBox.app/Contents/MacOS/tingly-box-gui > "$RUNNER_TEMP/tb-gui.symbols"
          grep -Fxq '_OBJC_CLASS_$_AppDelegate' "$RUNNER_TEMP/tb-gui.symbols"
          grep -Fxq '_OBJC_CLASS_$_TinglyVZAppDelegate' "$RUNNER_TEMP/tb-gui.symbols"
      - name: Verify platform sandbox registration and rejection
        run: go test ./projects/internal/project -run '^Test(SandboxRuntimesMatchPlatform|WindowsSandboxUnavailable)$' -count=1

  tingly-integration:
    name: Tingly IM and Projects harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Run Tingly integration harness
        run: go test -race ./internal/server/module/projects -run '^TestTingly' -count=1

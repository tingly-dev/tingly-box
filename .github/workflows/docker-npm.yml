name: Docker npm Image Build and Push

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release tag
        id: validate
        uses: ./.github/actions/validate-tag
        with:
          release_tag: ${{ github.event.inputs.release_tag }}

      - name: Wait for published npm packages
        env:
          NPM_VERSION: ${{ steps.validate.outputs.npm_version }}
        run: bash build/npx/scripts/wait-for-docker-npm-packages.sh "$NPM_VERSION"

      # Same mapping as npm.yml: stable → latest, pre-release (v1.2.3-rc1) → rc.
      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-push
        with:
          image_name: tingly-box
          version: ${{ steps.validate.outputs.tag }}
          channel_tag: ${{ steps.validate.outputs.is_prerelease == 'true' && 'rc' || 'latest' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: |
            TINGLY_VERSION=${{ steps.validate.outputs.npm_version }}
          expected_version: ${{ steps.validate.outputs.npm_version }}

name: Verify Compile

# PR-time compile check (unit tests ready but disabled), split by surface so each one only runs
# when something it builds from changed:
#   - compile-cli      : go build/vet of ./cli/... (the tingly-box binary)
#   - compile-gui      : go build/vet of the Wails3 GUI (Linux, GTK4 +
#                        WebKitGTK via cgo)
#   - test-go          : go test of the root module and the other go.work
#                        modules (afk, agentboot, ai, imbot, swagger)
#                        (DISABLED for now, see below)
#   - compile-frontend : pnpm build of frontend/ and its lint (vitest DISABLED)
# Unit tests are commented out for now (all passed when added); uncomment to enable.
# The jobs are independent: the Go builds embed the committed PLACEHOLDER
# dist, so they never wait on the frontend build. Full release
# builds (and the release-asset checks) live in release.yml and the
# release-*/verify-release-* workflows it calls.
on:
  pull_request:
    # Everything except areas no build here reads (docs, CI config, the
    # non-Go tooling trees). Go-side assets are kept on purpose: packages
    # go:embed JSON/YAML/templates/icons/dist, so they can break a compile.
    paths:
      - '**'
      - '!**/*_test.go'
      - '!frontend/**'
      - '!homepage/**'
      - '!docs/**'
      - '!.design/**'
      - '!.claude/**'
      - '!.agents/**'
      - '!.github/**'
      - '!tests/**'
      - '!sdk/**'
      - '!build/**'
      - '!deploy/**'
      - '!scripts/**'
      - '!*.md'
      - '!**/README.md'
      - '!**/CLAUDE.md'
      - '!Taskfile*.yml'
      - '!LICENSE*'
      - '!NOTICE'
      - '!.gitignore'
      - 'frontend/**'
      - '!frontend/**/*.md'
      # Test-only changes run test-go (disabled; uncomment with it).
      # - '**/*_test.go'
      - '.github/workflows/verify-compile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.self == 'true' || steps.filter.outputs.cli == 'true' }}
      gui: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.self == 'true' || steps.filter.outputs.gui == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.self == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.openapi == 'true' }}
      # gotest: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.self == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.gotest == 'true' }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # Go surfaces = every file outside the non-Go areas (Go packages
          # go:embed non-Go assets, so those count), minus the other
          # surface's own directory. `every`: a file must match all patterns.
          predicate-quantifier: every
          filters: |
            self:
              - '.github/workflows/verify-compile.yml'
            cli:
              - '**'
              - '!gui/**'
              - '!**/*_test.go'
              - '!frontend/**'
              - '!homepage/**'
              - '!docs/**'
              - '!.design/**'
              - '!.claude/**'
              - '!.agents/**'
              - '!.github/**'
              - '!tests/**'
              - '!sdk/**'
              - '!build/**'
              - '!deploy/**'
              - '!scripts/**'
              - '!*.md'
              - '!**/README.md'
              - '!**/CLAUDE.md'
              - '!Taskfile*.yml'
              - '!openapi.json'
              - '!LICENSE*'
              - '!NOTICE'
              - '!.gitignore'
            gui:
              - '**'
              - '!cli/**'
              - '!**/*_test.go'
              - '!frontend/**'
              - '!homepage/**'
              - '!docs/**'
              - '!.design/**'
              - '!.claude/**'
              - '!.agents/**'
              - '!.github/**'
              - '!tests/**'
              - '!sdk/**'
              - '!build/**'
              - '!deploy/**'
              - '!scripts/**'
              - '!*.md'
              - '!**/README.md'
              - '!**/CLAUDE.md'
              - '!Taskfile*.yml'
              - '!openapi.json'
              - '!LICENSE*'
              - '!NOTICE'
              - '!.gitignore'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            openapi:
              - 'openapi.json'
            # gotest:
            #   - '**/*_test.go'

  compile-cli:
    name: Compile cli (Linux)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Locate Go caches
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Keyed per job: setup-go's own key is only OS/arch, so jobs sharing a
      # runner (e.g. the three ubuntu-22.04 targets) overwrite each other's cache.
      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-compile-cli-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-compile-cli-

      - name: Build CLI
        run: go build ./cli/...

      - name: Vet CLI
        run: go vet ./cli/...

  compile-gui:
    name: Compile gui/wails3 (Linux)
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      # The wails3 Linux backend links against GTK4 + WebKitGTK 6.0 via cgo.
      - name: Install webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Locate Go caches
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Keyed per job: setup-go's own key is only OS/arch, so jobs sharing a
      # runner (e.g. the three ubuntu-22.04 targets) overwrite each other's cache.
      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-compile-gui-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-compile-gui-

      - name: Build GUI package
        run: go build ./gui/wails3/...

      - name: Vet GUI package
        run: go vet ./gui/wails3/...

  # Unit tests: disabled for now. Uncomment this job, `gotest` above and
  # the `**/*_test.go` path to run it.
  # test-go:
  #   name: Go unit tests
  #   needs: changes
  #   if: needs.changes.outputs.gotest == 'true'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #       with:
  #         submodules: true
  #
  #     - name: Setup Go
  #       uses: actions/setup-go@v7
  #       with:
  #         go-version: '1.26'
  #         cache-dependency-path: '**/go.sum'
  #
  #     # ./... is the root module only; the other go.work modules are listed.
  #     # gui/wails3 is left to compile-gui (it needs the GTK headers).
  #     - name: Test
  #       run: go test ./... ./afk/... ./agentboot/... ./ai/... ./imbot/... ./swagger/...

  compile-frontend:
    name: Compile frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same install + codegen as the release build (build-frontend.yml).
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # Same policy as build-frontend.yml (the release build): legacy type errors exist, so report them
      # without failing the check.
      - name: Type check (non-blocking)
        continue-on-error: true
        run: |
          pnpm typecheck || echo "::warning::TypeScript errors found (non-blocking, see step log)"

      - name: Build frontend
        run: pnpm build

      # Unit tests: disabled for now; uncomment to run vitest.
      # - name: Unit tests
      #   run: pnpm test

      - name: Lint
        run: pnpm lint

name: GUI Build

# Unsigned Wails3 desktop GUI packages, one per platform the release and the
# tingly-box-gui npm package distribute:
#
#   tingly-box-gui-macos-arm64.zip    TinglyBox.app (Apple Silicon)
#   tingly-box-gui-windows-amd64.zip  tingly-box.exe
#   tingly-box-gui-linux-amd64.deb    Ubuntu 24.04+ / Debian 13+
#   tingly-box-gui-linux-amd64.rpm    Fedora 40+
#
# Intel Macs are not built: the GUI targets Apple Silicon only (the CLI still
# ships darwin/amd64). Linux is amd64 only, as distribution packages so the
# system provides GTK4 / WebKitGTK 6.0 (build/linux/nfpm/nfpm.yaml).
#
# The macOS name is a contract: build/npx/tingly-box-gui/bin.js downloads
# exactly `tingly-box-gui-macos-arm64.zip` from the release tag. macOS apps
# are ad-hoc signed only (no Developer ID, no notarization) — fine through npm,
# which never sets the quarantine flag; a browser download needs one
# "Open Anyway" (see the release notes).
#
# Three ways to run it, none needing the CLI build or the harness:
#   - release.yml (workflow_call): GUI built alongside a fresh release, which
#     attaches the artifacts itself.
#   - workflow_dispatch, attach_to_release=false (default): a test build; the
#     packages are only workflow artifacts.
#   - workflow_dispatch, attach_to_release=true: package the GUI on its own and
#     attach it to an EXISTING GitHub Release (release_tag). This is how a
#     release cut without the GUI gets one later, or a broken GUI asset is
#     replaced, without re-running release.yml. Publishing the npm package
#     (`tingly-box-gui`) is a separate step afterwards: npm.yml, publish_gui.

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Version baked into the binaries'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version label (e.g. v1.6.2). Empty = dev-<sha>. Required (an existing release tag) when attach_to_release is on.'
        required: false
        type: string
        default: ''
      attach_to_release:
        description: 'Attach the packages to the existing GitHub Release named by release_tag (replaces same-named assets)'
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '24'
  # Keep in lockstep with gui/wails3/go.mod and Taskfile.wails.yml's wails:check.
  WAILS_VERSION: v3.0.0-beta.26

permissions:
  contents: read

jobs:
  # Fail fast, before the three-platform build, if attaching can't work.
  preflight:
    name: Check release target
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.attach_to_release
    permissions:
      contents: read
    steps:
      - name: Release must exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::release_tag is required when attach_to_release is on"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG does not exist; create it (release.yml) first"
            exit 1
          fi

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: preflight
    # preflight is skipped on workflow_call / plain test builds; only a failed
    # preflight may stop the build.
    if: ${{ !cancelled() && needs.preflight.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos, arch: arm64 }
          - { os: windows-latest, platform: windows, arch: amd64 }
          # 24.04: the oldest Ubuntu with WebKitGTK 6.0, which wails v3 links.
          - { os: ubuntu-24.04, platform: linux, arch: amd64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION="${{ inputs.release_tag }}"
          [ -n "$VERSION" ] || VERSION="dev-${GITHUB_SHA:0:7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "* \`${{ matrix.platform }}-${{ matrix.arch }}\`: version \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gui-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gui-${{ matrix.arch }}-
            ${{ runner.os }}-go-

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install GTK4 / WebKitGTK 6.0 headers (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install go-task and wails3
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install frontend dependencies
        shell: bash
        working-directory: ./frontend
        run: |
          corepack enable
          pnpm approve-builds --all
          pnpm install --frozen-lockfile

      - name: Run codegen
        run: task codegen

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          task darwin:package ARCH=${{ matrix.arch }} VERSION="${{ steps.ver.outputs.version }}"
          codesign --verify --deep --strict --verbose=2 bin/TinglyBox.app
          file bin/TinglyBox.app/Contents/MacOS/tingly-box | tee /dev/stderr | grep -q "Mach-O 64-bit executable arm64"
          mkdir -p dist
          # --norsrc --noextattr: without them ditto stores extended attributes
          # as "._*" entries, which unzip and the npm shim's unzipper write
          # into the bundle as files and so break its signature.
          ditto -c -k --norsrc --noextattr --keepParent bin/TinglyBox.app "dist/tingly-box-gui-macos-${{ matrix.arch }}.zip"
          ls -la dist/

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          task windows:build PRODUCTION=true ARCH=${{ matrix.arch }} VERSION="${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path bin/tingly-box.exe -DestinationPath dist/tingly-box-gui-windows-${{ matrix.arch }}.zip
          Get-ChildItem dist

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          task linux:package VERSION="${{ steps.ver.outputs.version }}"
          # Install the deb on this runner and check what a user would get:
          # the binary under its own name (never the CLI's `tingly-box`), the
          # launcher entry, and every shared library resolvable.
          sudo apt-get install -y ./bin/tingly-box-gui-linux-amd64.deb
          dpkg-deb -f bin/tingly-box-gui-linux-amd64.deb Package Version Depends
          test -x /usr/bin/tingly-box-gui
          test -f /usr/share/applications/dev.tingly.box.desktop
          # Not `! ldd | grep`: set -e ignores a negated pipeline.
          if ldd /usr/bin/tingly-box-gui | grep "not found"; then exit 1; fi
          mkdir -p dist
          cp bin/tingly-box-gui-linux-amd64.deb bin/tingly-box-gui-linux-amd64.rpm dist/
          ls -la dist/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  # Standalone attach: put the packages on an existing release. (Under
  # release.yml the github-release job attaches them instead.)
  attach:
    name: Attach to release ${{ inputs.release_tag }}
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.attach_to_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download GUI packages
        uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: ./gui
          merge-multiple: true

      - name: Checksums
        working-directory: ./gui
        run: |
          ls -la
          sha256sum *.zip *.deb *.rpm > checksums-gui.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        working-directory: ./gui
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            *.zip *.deb *.rpm checksums-gui.txt

      - name: Add the desktop section to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          START="<!-- GUI_ASSETS:START -->"
          END="<!-- GUI_ASSETS:END -->"
          BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          # Idempotent: release.yml (build_gui) or an earlier run already wrote
          # the section, so a re-attach only swaps the assets.
          case "$BODY" in *"## Desktop app (unsigned)"*) echo "Release notes already describe the desktop app"; exit 0 ;; esac
          {
            printf '%s\n\n' "$BODY"
            echo "$START"
            cat <<'NOTES'
          ## Desktop app (unsigned)

          | Platform | Download |
          | --- | --- |
          | macOS Apple Silicon | `tingly-box-gui-macos-arm64.zip` |
          | Windows x64 | `tingly-box-gui-windows-amd64.zip` |
          | Linux x64 — Ubuntu 24.04+ / Debian 13+ | `tingly-box-gui-linux-amd64.deb` |
          | Linux x64 — Fedora 40+ | `tingly-box-gui-linux-amd64.rpm` |

          The desktop builds are not signed by Apple or Microsoft. On macOS use `npx tingly-box-gui` (skips Gatekeeper), or unzip and **System Settings → Privacy & Security → Open Anyway**. On Windows choose **More info → Run anyway** if SmartScreen appears. On Linux: `sudo apt install ./tingly-box-gui-linux-amd64.deb` or `sudo dnf install ./tingly-box-gui-linux-amd64.rpm`.
          NOTES
            echo "$END"
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

name: known-gap-insert-at-turn-end
description: >
  KNOWN GAP, recorded as it behaves today. The user writes while the
  coordinator's turn is about to end (its last reply is being produced): the
  message joins that turn, Claude Code answers it in a turn of its own after
  the one Projects was running, and there the Projects tools refuse with "No
  coordinator turn is active", so the request is not acted on. When this is
  fixed, flip the expect_result of coordinator.act to the started thread.
project:
  name: Demo
  goal: Ship the demo app
model:
  id: known-gap-insert-at-turn-end
  kind: script
  protocols: [anthropic]
  script:
    tracks:
      coordinator:
        bind: {tools_include: ["__start_thread"], system_contains: "You are the project coordinator"}
        steps:
          - id: greet
            expect: {last_text_contains: "Hi"}
            # Held until the driver has sent the second message, so it is
            # inserted while this turn's last request is in flight.
            after: ["signal:sent"]
            reply: {content: "Hello! What should we work on?"}
          - id: act
            expect: {last_user_contains: "add a CHANGELOG"}
            reply:
              tool_calls:
                - id: start
                  name: mcp__tingly-projects__start_thread
                  arguments: {title: Add CHANGELOG, task: "Create CHANGELOG.md and commit it."}
                  expect_result: {contains: "No coordinator turn is active", is_error: true}
          - id: answered
            reply: {content: "I could not start the thread."}
steps:
  - say: Hi
  - reached: coordinator.greet
  - say: Please add a CHANGELOG.
  - signal: sent
  - served: coordinator.answered
expect:
  threads: 0
